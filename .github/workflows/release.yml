# On every push to main: if a GitHub release already ships this native
# fingerprint (runtime version), publish the JS as an EAS Update; otherwise
# build a signed APK right on the runner (no EAS Build) and publish it as a
# GitHub release in the public releases repo. "[apk]" in the commit message
# (or force_build on a manual run) builds an APK even for a known fingerprint.
name: Release

on:
  push:
    branches: [main]
    # The landing page and the backend are not part of the app.
    paths-ignore: ['landing/**', 'server/**']
  workflow_dispatch:
    inputs:
      force_build:
        description: Build a new APK even if a release has this fingerprint
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  CHANNEL: preview
  RELEASES_REPO: ${{ vars.RELEASES_REPO || 'varekai-dev/fitness-app-releases' }}
  GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve runtime version
        id: runtime
        run: |
          hash=$(npx expo-updates runtimeversion:resolve --platform android | tail -1 | jq -r '.runtimeVersion')
          echo "Runtime version: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.expo.version' app.json)" >> "$GITHUB_OUTPUT"

      # Every release lists its runtime version in the notes.
      - name: Find a release with this runtime version
        id: existing
        env:
          HASH: ${{ steps.runtime.outputs.hash }}
          FORCE: ${{ inputs.force_build || contains(github.event.head_commit.message, '[apk]') }}
        run: |
          tag=$(gh api "repos/$RELEASES_REPO/releases" --paginate \
            --jq ".[] | select(.body | contains(\"runtimeVersion: $HASH\")) | .tag_name" | head -1)
          echo "Existing release: ${tag:-none}"
          if [ -z "$tag" ] || [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish OTA update
        if: steps.existing.outputs.build != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest update --channel "$CHANNEL" --environment "$CHANNEL" \
            --platform android --message "$(git log -1 --pretty=%s)" --non-interactive

      - uses: actions/setup-java@v4
        if: steps.existing.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.existing.outputs.build == 'true'

      - name: Build APK
        if: steps.existing.outputs.build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          npm run build:android

      - name: Publish GitHub release
        if: steps.existing.outputs.build == 'true'
        env:
          VERSION: ${{ steps.runtime.outputs.version }}
          HASH: ${{ steps.runtime.outputs.hash }}
        run: |
          cp "dist/fitness-$VERSION.apk" fitness.apk
          {
            git log -1 --pretty=%B | grep -v '^Co-Authored-By:'
            echo
            echo "runtimeVersion: $HASH"
          } > notes.md
          gh release create "v$VERSION" fitness.apk --repo "$RELEASES_REPO" \
            --title "FitKit $VERSION" --notes-file notes.md --latest
