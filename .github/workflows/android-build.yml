name: Android build

# Started by hand from the Actions tab, so builds don't eat the EAS quota on every push.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile from eas.json
        type: choice
        options:
          - preview
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # The build runs on EAS; --no-wait ends the job once it's queued.
      # The APK link shows up on expo.dev when the build finishes.
      - run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
