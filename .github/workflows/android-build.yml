name: Android build

# Started by hand from the Actions tab, so builds don't eat the EAS quota on every push.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile from eas.json
        type: choice
        options:
          - preview
        default: preview

permissions:
  contents: write # to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Waits for EAS to finish, so the job fails when the build does.
      - name: Build on EAS
        run: |
          eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait --json > build.json
          jq -r '.[0] | "version=\(.appVersion)\ncode=\(.appBuildVersion)\nurl=\(.artifacts.applicationArchiveUrl)\nid=\(.id)"' build.json >> "$GITHUB_ENV"

      # The build number goes up on every build, so the tag is unique even without a version bump.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="fitness-$version-$code.apk"
          curl -fsSL "$url" -o "$apk"
          gh release create "v$version-$code" "$apk" \
            --target "$GITHUB_SHA" \
            --title "$version ($code)" \
            --notes "Android build from EAS: https://expo.dev/accounts/varekai/projects/fitness/builds/$id"
